<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Training Dashboards</title>
	<style>
		:root {
			--bg: #f7f7f2;
			--card: #ffffff;
			--ink: #1f2933;
			--muted: #52606d;
			--line: #d9e2ec;
			--accent: #0b6e4f;
			--accent-soft: #d8f3e8;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "Avenir Next", "Segoe UI", sans-serif;
			background:
				radial-gradient(circle at 0 0, #edf7f3 0%, transparent 45%),
				radial-gradient(circle at 100% 100%, #fff5e6 0%, transparent 42%),
				var(--bg);
			color: var(--ink);
			min-height: 100vh;
		}

		.page {
			max-width: 1180px;
			margin: 0 auto;
			padding: 24px 16px;
		}

		.header {
			margin-bottom: 16px;
		}

		h1 {
			margin: 0;
			font-size: clamp(1.6rem, 3.5vw, 2.2rem);
			letter-spacing: 0.02em;
		}

		.subtitle {
			margin-top: 6px;
			color: var(--muted);
			font-size: 0.95rem;
		}

		.layout {
			display: grid;
			grid-template-columns: 320px 1fr;
			gap: 16px;
			align-items: start;
		}

		.card {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 14px;
			box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
			padding: 14px;
		}

		label {
			display: block;
			font-weight: 600;
			margin-bottom: 6px;
			font-size: 0.92rem;
		}

		input,
		select,
		button {
			width: 100%;
			border-radius: 10px;
			border: 1px solid var(--line);
			padding: 9px 10px;
			font: inherit;
			background: #fff;
			color: inherit;
		}

		input:focus,
		select:focus,
		button:focus {
			outline: 2px solid var(--accent-soft);
			border-color: var(--accent);
		}

		.actions {
			display: flex;
			gap: 8px;
			margin-top: 10px;
		}

		.actions button,
		.actions a {
			flex: 1;
			text-align: center;
			text-decoration: none;
			display: inline-block;
			border-radius: 10px;
			padding: 9px 10px;
			font-weight: 600;
		}

		.actions button {
			background: var(--accent);
			color: #fff;
			border: 1px solid var(--accent);
			cursor: pointer;
		}

		.actions a {
			border: 1px solid var(--line);
			color: var(--ink);
			background: #fff;
		}

		.meta {
			margin-top: 12px;
			font-size: 0.88rem;
			color: var(--muted);
			line-height: 1.4;
			min-height: 4.5em;
		}

		.config-box {
			margin-top: 10px;
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: #fbfcfd;
		}

		.config-title {
			margin: 0 0 6px;
			font-size: 0.84rem;
			color: var(--muted);
			font-weight: 600;
		}

		.config-content {
			margin: 0;
			font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
			font-size: 0.78rem;
			line-height: 1.35;
			max-height: 600px;
			overflow: auto;
			white-space: pre-wrap;
			word-break: break-word;
			color: #334e68;
		}

		.metrics-box {
			margin-top: 10px;
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: #fbfcfd;
		}

		.metrics-title {
			margin: 0 0 8px;
			font-size: 0.84rem;
			color: var(--muted);
			font-weight: 600;
		}

		.metrics-summary {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 4px 8px;
			font-size: 0.82rem;
			color: #334e68;
		}

		.metric-label {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			min-width: 0;
		}

		.metrics-summary strong {
			font-weight: 600;
			color: #243b53;
		}

		.metric-help {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 16px;
			height: 16px;
			border-radius: 999px;
			border: 1px solid #9fb3c8;
			background: #fff;
			color: var(--muted);
			font-size: 0.68rem;
			font-weight: 700;
			cursor: help;
			position: relative;
			flex: 0 0 auto;
		}

		.metric-help::after {
			content: attr(data-tooltip);
			position: absolute;
			left: calc(100% + 8px);
			top: 50%;
			transform: translateY(-50%);
			z-index: 2;
			min-width: 210px;
			max-width: 260px;
			padding: 8px 10px;
			border-radius: 8px;
			background: #102a43;
			color: #f0f4f8;
			font-size: 0.74rem;
			line-height: 1.35;
			white-space: normal;
			box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
			opacity: 0;
			pointer-events: none;
			transition: opacity 120ms ease;
		}

		.metric-help:hover::after,
		.metric-help:focus-visible::after {
			opacity: 1;
		}

		.metric-value {
			text-align: right;
			font-variant-numeric: tabular-nums;
		}

		.metrics-empty {
			margin: 0;
			font-size: 0.82rem;
			color: var(--muted);
		}

		.metrics-images {
			margin-top: 8px;
			display: grid;
			gap: 8px;
		}

		.metrics-image {
			margin: 0;
			padding: 6px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #fff;
		}

		.metrics-image figcaption {
			font-size: 0.75rem;
			color: var(--muted);
			margin-bottom: 6px;
		}

		.metrics-image img {
			display: block;
			width: 100%;
			height: auto;
			border-radius: 6px;
			border: 1px solid #ebeff4;
		}

		.viewer {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.status {
			margin: 0;
			color: var(--muted);
			font-size: 0.9rem;
		}

		iframe {
			width: 100%;
			min-height: 72vh;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: #fff;
		}

		@media (max-width: 900px) {
			.layout {
				grid-template-columns: 1fr;
			}

			iframe {
				min-height: 64vh;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="header">
			<h1>Training Dashboards</h1>
			<p class="subtitle">Static browser for exported Panel HTML runs hosted in this repository.</p>
		</header>

		<section class="layout">
			<aside class="card">
				<label for="search">Filter runs</label>
				<input id="search" type="search" placeholder="Type run id or title">

				<label for="run-select" style="margin-top: 10px;">Select run</label>
				<select id="run-select"></select>

				<div class="actions">
					<button id="open-btn" type="button">Open</button>
					<a id="direct-link" href="#" target="_blank" rel="noopener noreferrer">Open Tab</a>
				</div>

				<div id="run-meta" class="meta">Loading manifest...</div>
				<div id="run-config" class="config-box">
					<p id="run-config-title" class="config-title">Config JSON</p>
					<pre id="run-config-content" class="config-content">Waiting for selection...</pre>
				</div>
				<div id="run-metrics" class="metrics-box">
					<p id="run-metrics-title" class="metrics-title">Quality Metrics</p>
					<div id="run-metrics-content" class="metrics-empty">Waiting for selection...</div>
				</div>
			</aside>

			<section class="viewer">
				<p id="status" class="status">Preparing dashboard viewer...</p>
				<iframe id="frame" title="Selected dashboard" loading="lazy"></iframe>
			</section>
		</section>
	</main>

	<script>
		const manifestPath = "manifest.json";
		const searchInput = document.getElementById("search");
		const select = document.getElementById("run-select");
		const openBtn = document.getElementById("open-btn");
		const directLink = document.getElementById("direct-link");
		const meta = document.getElementById("run-meta");
		const runConfigTitle = document.getElementById("run-config-title");
		const runConfigContent = document.getElementById("run-config-content");
		const runMetricsTitle = document.getElementById("run-metrics-title");
		const runMetricsContent = document.getElementById("run-metrics-content");
		const frame = document.getElementById("frame");
		const statusText = document.getElementById("status");
		const metricHelpText = {
			correctness: "Image MSE between the particle-rendered state and the target over rollout steps. Lower is better. The displayed value is the final curve value.",
			stability: "Average per-step movement magnitude ||x_t - x_{t-1}||. Lower is more stable. The displayed value is the mean over the rollout.",
			robustness: "Normalized drift between the baseline rollout and a noisy rollout. Lower is better. The displayed value is the final normalized drift.",
			scalability: "Chamfer distance between the baseline final state and a larger scaled/downsampled rollout. Lower is better. The displayed value is the mean over repeats."
		};

		let allRuns = [];
		let filteredRuns = [];
		let latestConfigRequest = 0;
		let latestMetricsRequest = 0;

		function setConfigStatus(message, title = "Config JSON") {
			runConfigTitle.textContent = title;
			runConfigContent.textContent = message;
		}

		function renderConfigJson(jsonData, sourcePath) {
			runConfigTitle.textContent = `Config JSON (${sourcePath})`;
			runConfigContent.textContent = JSON.stringify(jsonData, null, 2);
		}

		function setMetricsStatus(message, title = "Quality Metrics") {
			runMetricsTitle.textContent = title;
			runMetricsContent.className = "metrics-empty";
			runMetricsContent.textContent = message;
		}

		function formatMetricValue(value) {
			if (typeof value !== "number" || Number.isNaN(value) || !Number.isFinite(value)) {
				return "n/a";
			}
			if (Math.abs(value) >= 1000) {
				return value.toExponential(2);
			}
			return value.toFixed(6);
		}

		function escapeHtml(value) {
			return String(value)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/\"/g, "&quot;")
				.replace(/'/g, "&#39;");
		}

		function resolveRelativePath(path, baseDir) {
			const baseParts = baseDir.split("/").filter(Boolean);
			const pathParts = path.split("/").filter(Boolean);
			for (const segment of pathParts) {
				if (segment === ".") {
					continue;
				}
				if (segment === "..") {
					if (baseParts.length > 0) {
						baseParts.pop();
					}
					continue;
				}
				baseParts.push(segment);
			}
			return baseParts.join("/");
		}

		function getMetricTooltip(metricKey, metric) {
			const details = [metricHelpText[metricKey] || ""];
			if (metricKey === "robustness" && typeof metric.noise_factor === "number") {
				details.push(`noise_factor=${metric.noise_factor}`);
			}
			if (metricKey === "scalability") {
				if (typeof metric.scale_factor === "number") {
					details.push(`scale_factor=${metric.scale_factor}`);
				}
				if (typeof metric.downsample_mode === "string" && metric.downsample_mode) {
					details.push(`downsample_mode=${metric.downsample_mode}`);
				}
				if (typeof metric.std === "number" && Number.isFinite(metric.std)) {
					details.push(`std=${formatMetricValue(metric.std)}`);
				}
			}
			if (metricKey === "stability" && typeof metric.late_value === "number") {
				details.push(`late_value=${formatMetricValue(metric.late_value)}`);
			}
			return details.filter(Boolean).join(" ");
		}

		function resolveAssetPath(path, runDir) {
			if (typeof path !== "string") {
				return null;
			}

			const clean = path.trim();
			if (!clean) {
				return null;
			}

			if (/^(https?:|data:)/i.test(clean)) {
				return clean;
			}

			const normalized = clean.replace(/\\/g, "/");
			const docsRunsIdx = normalized.indexOf("docs/runs/");
			if (docsRunsIdx >= 0) {
				return normalized.slice(docsRunsIdx + 5);
			}

			const runsIdx = normalized.indexOf("runs/");
			if (runsIdx >= 0) {
				return normalized.slice(runsIdx);
			}

			if (normalized.startsWith("/")) {
				return normalized.replace(/^\/+/, "");
			}

			if (normalized.startsWith("./") || normalized.startsWith("../")) {
				return resolveRelativePath(normalized, runDir);
			}

			return `${runDir}/${normalized}`;
		}

		function renderMetricsJson(metricsData, sourcePath, runDir) {
			runMetricsTitle.textContent = `Quality Metrics (${sourcePath})`;

			const metricOrder = ["correctness", "stability", "robustness", "scalability"];
			const summaryRows = [];
			const imageRows = [];

			metricOrder.forEach((metricKey) => {
				const metric = metricsData && typeof metricsData === "object" ? metricsData[metricKey] : null;
				const tooltip = escapeHtml(getMetricTooltip(metricKey, metric || {}));
				const labelHtml = `<span class="metric-label"><strong>${metricKey}</strong><span class="metric-help" tabindex="0" data-tooltip="${tooltip}" aria-label="${tooltip}">?</span></span>`;
				if (!metric || typeof metric !== "object") {
					summaryRows.push(`${labelHtml}<span class="metric-value">n/a</span>`);
					return;
				}

				summaryRows.push(`${labelHtml}<span class="metric-value">${formatMetricValue(metric.value)}</span>`);

				const imagePath = resolveAssetPath(metric.plot, runDir);
				if (imagePath) {
					imageRows.push(
						`<figure class="metrics-image"><figcaption>${metricKey} plot</figcaption><img src="${imagePath}" alt="${metricKey} metric plot" loading="lazy"></figure>`
					);
				}
			});

			const summaryHtml = `<div class="metrics-summary">${summaryRows.join("")}</div>`;
			const imagesHtml = imageRows.length > 0
				? `<div class="metrics-images">${imageRows.join("")}</div>`
				: "";

			runMetricsContent.className = "";
			runMetricsContent.innerHTML = `${summaryHtml}${imagesHtml}`;
		}

		function getRunDirFromPath(runPath) {
			const idx = runPath.lastIndexOf("/");
			if (idx < 0) {
				return "";
			}
			return runPath.slice(0, idx);
		}

		async function loadRunConfig(run, requestId) {
			if (!run || !run.path) {
				if (requestId === latestConfigRequest) {
					setConfigStatus("No run selected.");
				}
				return;
			}

			const runDir = getRunDirFromPath(run.path);
			const candidates = [
				`${runDir}/config.json`,
				`${runDir}/model.pt_config.json`
			];

			for (const candidate of candidates) {
				try {
					const response = await fetch(candidate, { cache: "no-store" });
					if (!response.ok) {
						continue;
					}
					const jsonData = await response.json();
					if (requestId === latestConfigRequest) {
						renderConfigJson(jsonData, candidate);
					}
					return;
				} catch (error) {
					continue;
				}
			}

			if (requestId === latestConfigRequest) {
				setConfigStatus("No config JSON found.");
			}
		}

		async function loadRunMetrics(run, requestId) {
			if (!run || !run.path) {
				if (requestId === latestMetricsRequest) {
					setMetricsStatus("No metrics available.");
				}
				return;
			}

			const runDir = getRunDirFromPath(run.path);
			const candidates = [];
			if (typeof run.metrics_path === "string" && run.metrics_path) {
				candidates.push(run.metrics_path);
			}
			candidates.push(`${runDir}/metrics.json`);

			for (const candidate of candidates) {
				try {
					const response = await fetch(candidate, { cache: "no-store" });
					if (!response.ok) {
						continue;
					}
					const jsonData = await response.json();
					if (requestId === latestMetricsRequest) {
						renderMetricsJson(jsonData, candidate, runDir);
					}
					return;
				} catch (error) {
					continue;
				}
			}

			if (requestId === latestMetricsRequest) {
				setMetricsStatus("No metrics available for this run.");
			}
		}

		function updateMeta(run) {
			if (!run) {
				meta.textContent = "No run selected.";
				return;
			}

			const parts = [];
			parts.push(`id: ${run.id}`);
			if (run.updated_at) {
				parts.push(`updated: ${run.updated_at}`);
			}
			if (run.description) {
				parts.push(run.description);
			}
			meta.textContent = parts.join(" | ");
		}

		function loadRun(run, pushHash = true) {
			if (!run) {
				statusText.textContent = "No run selected.";
				frame.removeAttribute("src");
				directLink.href = "#";
				updateMeta(null);
				latestConfigRequest += 1;
				latestMetricsRequest += 1;
				setConfigStatus("No run selected.");
				setMetricsStatus("No metrics available.");
				return;
			}

			frame.src = run.path;
			directLink.href = run.path;
			statusText.textContent = `Viewing ${run.title || run.id}`;
			updateMeta(run);
			latestConfigRequest += 1;
			latestMetricsRequest += 1;
			const requestId = latestConfigRequest;
			const metricsRequestId = latestMetricsRequest;
			setConfigStatus("Loading config JSON...");
			setMetricsStatus("Loading metrics...");
			loadRunConfig(run, requestId);
			loadRunMetrics(run, metricsRequestId);

			if (pushHash) {
				const encoded = encodeURIComponent(run.id);
				window.location.hash = `run=${encoded}`;
			}
		}

		function populateSelect(runs) {
			select.innerHTML = "";

			if (runs.length === 0) {
				const empty = document.createElement("option");
				empty.value = "";
				empty.textContent = "No runs available";
				select.appendChild(empty);
				openBtn.disabled = true;
				loadRun(null, false);
				return;
			}

			openBtn.disabled = false;
			runs.forEach((run, index) => {
				const option = document.createElement("option");
				option.value = String(index);
				option.textContent = `${run.title || run.id} (${run.id})`;
				select.appendChild(option);
			});
		}

		function applyFilter() {
			const q = searchInput.value.trim().toLowerCase();
			filteredRuns = allRuns.filter((run) => {
				const hay = `${run.id} ${run.title || ""} ${run.description || ""}`.toLowerCase();
				return hay.includes(q);
			});
			populateSelect(filteredRuns);

			if (filteredRuns.length > 0) {
				loadRun(filteredRuns[0], false);
			}
		}

		function runByHash() {
			const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
			const id = params.get("run");
			if (!id) {
				return null;
			}
			const decoded = decodeURIComponent(id);
			return allRuns.find((run) => run.id === decoded) || null;
		}

		async function init() {
			try {
				const response = await fetch(manifestPath, { cache: "no-store" });
				if (!response.ok) {
					throw new Error(`Manifest fetch failed (${response.status})`);
				}

				const manifest = await response.json();
				const runs = Array.isArray(manifest.runs) ? manifest.runs : [];
				allRuns = runs;
				filteredRuns = runs;
				populateSelect(filteredRuns);

				if (runs.length === 0) {
					statusText.textContent = "No dashboards were found. Add files under docs/runs/<run_id>/display.html and regenerate manifest.json.";
					return;
				}

				const fromHash = runByHash();
				if (fromHash) {
					const idx = filteredRuns.findIndex((run) => run.id === fromHash.id);
					if (idx >= 0) {
						select.value = String(idx);
					}
					loadRun(fromHash, false);
				} else {
					loadRun(filteredRuns[0], false);
				}
			} catch (error) {
				statusText.textContent = `Failed to load manifest: ${error.message}`;
				meta.textContent = "Create docs/manifest.json using scripts/generate_dashboard_manifest.py.";
				openBtn.disabled = true;
			}
		}

		openBtn.addEventListener("click", () => {
			const idx = Number(select.value);
			if (Number.isNaN(idx) || !filteredRuns[idx]) {
				return;
			}
			loadRun(filteredRuns[idx]);
		});

		select.addEventListener("change", () => {
			const idx = Number(select.value);
			if (Number.isNaN(idx) || !filteredRuns[idx]) {
				return;
			}
			loadRun(filteredRuns[idx]);
		});

		searchInput.addEventListener("input", applyFilter);

		window.addEventListener("hashchange", () => {
			const run = runByHash();
			if (run) {
				loadRun(run, false);
			}
		});

		init();
	</script>
</body>
</html>
